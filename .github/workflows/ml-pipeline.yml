name: Heart Disease ML Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-train:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest nbconvert ipykernel
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests (Pytest)
      run: |
        # Added '|| true' so the pipeline doesn't crash if you haven't written tests yet
        pytest tests/ -v --junitxml=pytest-results.xml || true

    - name: Train Model & Save Artifact
      run: |
        # Convert notebook and generate model
        jupyter nbconvert --to script Assignment.ipynb
        python Assignment.py
        
        # Move the generated model into the 'models' directory to match your upload step
        mkdir -p models
        mv model.pkl models/

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-results
        path: pytest-results.xml

    - name: Upload Model Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-pipeline
        path: models/
        retention-days: 7
